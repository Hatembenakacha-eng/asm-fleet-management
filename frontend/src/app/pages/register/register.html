<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-brand">
        <img src="/assets/logo-asm.png" alt="Logo ASM" class="logo-style">
      </div>
    </div>
    <h1>Créer un compte</h1>

    @if (erreur) { <div class="alert-error">{{ erreur }}</div> }
    @if (succes) { <div class="alert-success">Compte créé ! Redirection vers la connexion...</div> }

    <form (ngSubmit)="creerCompte()">
      <label for="name">Nom complet</label>
      <input id="name" type="text" [(ngModel)]="name" name="name" placeholder="Nom complet" required>

      <label for="email">Adresse e-mail</label>
      <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="email@example.com" required>

      <label for="role">Rôle</label>
      <select id="role" [(ngModel)]="role" name="role" required>
        <option value="utilisateur">Utilisateur</option>
        <option value="gestionnaire">Gestionnaire</option>
        <option value="admin">Administrateur</option>
      </select>


      <label for="password">Mot de passe</label>
      <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="Au moins 8 caractères" required>

      <label for="password_confirmation">Confirmer le mot de passe</label>
      <input id="password_confirmation" type="password" [(ngModel)]="password_confirmation" name="password_confirmation" placeholder="Retapez le mot de passe" required>

      <button class="btn btn-primary" type="submit" [disabled]="chargement">
        {{ chargement ? 'Création...' : 'Créer mon compte' }}
      </button>
    </form>

    <p class="switch">Déjà un compte ? <a routerLink="/login">Se connecter</a></p>
  </div>
</div>
