<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <img src="/assets/logo-asm.png" alt="Logo ASM" class="logo-style">
    </div>
    <h1>Créer un compte</h1>
    <p class="sub">Rejoignez le parc automobile ASM.</p>

    @if (erreurs.length > 0) {
      <ul class="field-errors">
        @for (e of erreurs; track e) { <li>{{ e }}</li> }
      </ul>
    }
    @if (succes) { <div class="alert-success">Compte créé ! Redirection vers la connexion...</div> }

    <form (ngSubmit)="creerCompte()">
      <label for="name">Nom complet</label>
      <div class="field-icon-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.3-4.2 4.3-6.4 7.5-6.4s6.2 2.2 7.5 6.4"/></svg>
        <input id="name" type="text" [(ngModel)]="name" name="name" placeholder="Nom complet" required>
      </div>

      <label for="email">Adresse e-mail</label>
      <div class="field-icon-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
        <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="nom@asm.tn" required>
      </div>

      <label for="password">Mot de passe</label>
      <div class="field-icon-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="Au moins 8 caractères" required>
      </div>

      <label for="password_confirmation">Confirmer le mot de passe</label>
      <div class="field-icon-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input id="password_confirmation" type="password" [(ngModel)]="password_confirmation" name="password_confirmation" placeholder="Retapez le mot de passe" required>
      </div>

      <button class="btn btn-primary" type="submit" [disabled]="chargement">
        {{ chargement ? 'Création...' : 'Créer mon compte' }}
      </button>
    </form>

    <p class="switch">Déjà un compte ? <a routerLink="/login">Se connecter</a></p>
  </div>
</div>
