<div class="page">
  <div class="page-head"><div><h1>{{ id ? 'Modifier' : 'Ajouter' }} une mission</h1></div></div>
  <div class="card form-page" style="padding:22px;">
    <form (ngSubmit)="onSubmit()">
      <label>Destination</label><input [(ngModel)]="destination" name="destination" required>
      <label>Description</label><input [(ngModel)]="description" name="description">
      <label>Date début</label><input type="date" [(ngModel)]="date_debut" name="date_debut" required>
      <label>Date fin</label><input type="date" [(ngModel)]="date_fin" name="date_fin" required>
      <label>Type de véhicule requis</label><input [(ngModel)]="type_vehicule" name="type_vehicule">
      <label>Capacité minimale</label><input type="number" [(ngModel)]="capacite_minimale" name="capacite_minimale">
      <div style="display:flex; gap:10px; margin-top:20px;">
        <div *ngIf="erreurs.length > 0" class="erreurs">
          <p *ngFor="let e of erreurs">{{ e }}</p>
        </div>
        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a routerLink="/missions" class="btn btn-outline">Annuler</a>
      </div>
    </form>
  </div>
</div>
