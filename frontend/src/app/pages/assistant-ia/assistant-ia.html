<div class="chat-shell">

  <!-- Panneau latéral : Choix de mission -->
  <div class="card chat-side">
    <h3>Recommandation rapide</h3>

    <select [(ngModel)]="missionChoisie" class="form-select">
      <option [ngValue]="null" disabled selected>Choisir une mission...</option>
      @for (m of missions; track m.id) {
        <option [value]="m.id">{{ m.destination }}</option>
      }
    </select>

    <button
      class="btn btn-primary"
      [disabled]="!missionChoisie || loading"
      (click)="demanderRecommandation()">
      Recommander un véhicule
    </button>
  </div>

  <!-- Zone de Chat principal -->
  <div class="card chat-main">
    <div class="chat-log">
      @for (msg of messages; track $index) {
        <div class="bulle" [class.moi]="msg.auteur === 'moi'">
          <p>{{ msg.texte }}</p>

          <!-- SOLUTION 2 : Bouton "Faire la demande" si un véhicule est suggéré -->
          @if (msg.vehiculeSuggere && msg.auteur === 'ia') {
            <div class="action-demande-container">
              <button
                class="btn btn-sm btn-success"
                (click)="faireDemande(msg)"
                [disabled]="loading">
                ⚡ Faire une demande pour cette mission
              </button>
            </div>
          }
        </div>
      }

      @if (loading) {
        <div class="bulle ia loading-bulle">
          <span>L'assistant réfléchit...</span>
        </div>
      }
    </div>

    <!-- Saisie libre avec touche Entrée -->
    <div class="chat-input-row">
      <input
        type="text"
        [(ngModel)]="messageLibre"
        (keyup.enter)="envoyerLibre()"
        placeholder="Pose une question libre..."
        [disabled]="loading" />
      <button
        class="btn btn-primary"
        (click)="envoyerLibre()"
        [disabled]="!messageLibre.trim() || loading">
        Envoyer
      </button>
    </div>
  </div>

</div>
