<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <img src="/assets/logo-asm.png" alt="Logo ASM" class="logo-style">

    </div>
    <h1>Connexion</h1>
    <p class="sub">Accédez au parc automobile ASM.</p>

    @if (erreur) { <div class="alert-error">{{ erreur }}</div> }

    <form (ngSubmit)="connecter()">
      <label>Adresse e-mail</label>
      <div class="field-icon-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
        <input type="email" [(ngModel)]="email" name="email" required placeholder="nom@asm.tn">
      </div>

      <label>Mot de passe</label>
      <div class="field-icon-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" [(ngModel)]="password" name="password" required placeholder="••••••••">
      </div>

      <button class="btn btn-primary" type="submit" [disabled]="chargement">
        {{ chargement ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>

    <p class="switch">Pas encore de compte ? <a routerLink="/register">Créer un compte employé</a></p>
  </div>
</div>
